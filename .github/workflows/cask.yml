name: Homebrew cask

# Points juniorsaldanha/homebrew-tap at the new .dmg once a release is published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: juniorsaldanha/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}  # write deploy key on the tap repo

      - name: Update version and sha256
        run: |
          v="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "*_universal.dmg" -O app.dmg
          sha=$(sha256sum app.dmg | cut -d' ' -f1)
          rm app.dmg
          sed -i -E "s/^(  version )\".*\"/\1\"$v\"/; s/^(  sha256 )\".*\"/\1\"$sha\"/" Casks/pico-key-manager.rb
          git diff

      - name: Push
        run: |
          git diff --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore(pico-key-manager): update to ${TAG#v}"
          git push
