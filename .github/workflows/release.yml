name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
            targets: wasm32-unknown-unknown
          - os: windows-latest
            args: ''
            targets: wasm32-unknown-unknown
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libudev-dev libpcsclite-dev pkg-config \
            libpipewire-0.3-dev libclang-dev libgbm-dev libdrm-dev libegl-dev libwayland-dev libxcb1-dev libxcb-randr0-dev  # xcap (screen QR scan)

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
          components: llvm-tools  # dx bundle needs it for wasm optimisation

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UI node deps (Tailwind)
        run: npm ci
        working-directory: ui

      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10,tauri-cli@2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Pico Key Manager ${{ github.ref_name }}
          releaseDraft: true
          # ponytail: unsigned builds; add Apple notarization / Windows signing secrets before a public release
