[package]
name = "picokeys-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ctap-hid-fido2 = "3.6"
types = { path = "../types" }
pcsc = "2.9.0"
getrandom = "0.3"
hidapi = "2"
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
serialport = "4.10"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
